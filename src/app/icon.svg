<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbeeb6"/>
      <stop offset="0.3" stop-color="#ecc95e"/>
      <stop offset="0.6" stop-color="#c99a2e"/>
      <stop offset="1" stop-color="#8f6a1f"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a8812f"/>
      <stop offset="0.5" stop-color="#ffe9a3"/>
      <stop offset="1" stop-color="#c99a2e"/>
    </linearGradient>
    <radialGradient id="bg" cx="0.5" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#1c1810"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <clipPath id="globe"><circle cx="256" cy="250" r="148"/></clipPath>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- anneau arrière -->
  <path d="M 70 300 A 196 70 -18 0 1 442 180" fill="none" stroke="url(#ring)" stroke-width="22" stroke-linecap="round" opacity="0.55"/>
  <!-- globe -->
  <circle cx="256" cy="250" r="148" fill="url(#gold)"/>
  <g clip-path="url(#globe)" fill="none" stroke="#0b0904" stroke-width="13" opacity="0.9">
    <ellipse cx="256" cy="250" rx="62" ry="148"/>
    <line x1="256" y1="90" x2="256" y2="410"/>
    <line x1="100" y1="250" x2="412" y2="250"/>
    <path d="M 112 180 Q 256 215 400 180"/>
    <path d="M 112 320 Q 256 285 400 320"/>
  </g>
  <circle cx="256" cy="250" r="148" fill="none" stroke="#0b0904" stroke-width="6" opacity="0.6"/>
  <!-- anneau avant (séparé du globe par un liseré noir) -->
  <path d="M 442 180 A 196 70 -18 0 1 70 300" fill="none" stroke="#050505" stroke-width="44" stroke-linecap="round"/>
  <path d="M 442 180 A 196 70 -18 0 1 70 300" fill="none" stroke="url(#ring)" stroke-width="24" stroke-linecap="round"/>
</svg>
